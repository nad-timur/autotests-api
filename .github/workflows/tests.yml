# Имя вашего workflow, которое будет отображаться в интерфейсе GitHub Actions
name: API tests

# Указываем, когда будет запускаться данный workflow
on:
  push:
    branches:
      - main  # Запускать workflow, когда будет сделан коммит в ветку main
  pull_request:
    branches:
      - main  # Запускать workflow, когда будет сделан pull request в ветку main

# Определяем все шаги, которые должны быть выполнены в рамках работы с тестами
jobs:
  # ------------------------------------------------------------
  # Джоба №1: запуск тестов и сохранение allure‑результатов
  # ------------------------------------------------------------
  run-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонирование репозитория
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Установка Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Клонирование репозитория с тестовым сервером
      - name: Clone test server repository
        run: git clone https://github.com/Nikita-Filonov/qa-automation-engineer-api-course.git

      # 4. Установка зависимостей тестового сервера
      - name: Install test server dependencies
        run: pip install -r qa-automation-engineer-api-course/requirements.txt

      # 5. Запуск тестового сервера (в фоне)
      - name: Start a test server
        env:
          APP_HOST: "http://localhost:8000"
          DATABASE_URL: "sqlite+aiosqlite:///./local.db"
          JWT_ALGORITHM: "HS256"
          JWT_SECRET_KEY: "qa-automation-engineer-api-course-secret-key"
          JWT_ACCESS_TOKEN_EXPIRE: 1800
          JWT_REFRESH_TOKEN_EXPIRE: 5184000
        run: uvicorn main:app --host 0.0.0.0 --port 8000 --app-dir ./qa-automation-engineer-api-course &

      # 6. Установка зависимостей проекта (тестов)
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 7. Запуск тестов с сохранением результатов для Allure
      - name: Run API tests with pytest and generate Allure results
        run: |
          pytest -m regression --alluredir=allure-results --numprocesses 2

      # 8. Сохранение папки allure-results как артефакта
      - name: Upload Allure results
        if: always()   # сохраняем даже при падении тестов (может пригодиться для отладки)
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

  # ------------------------------------------------------------
  # Джоба №2: публикация Allure‑отчёта на GitHub Pages
  # ------------------------------------------------------------
  publish-report:
    runs-on: ubuntu-latest
    needs: run-tests   # запускается только после успешного выполнения run-tests

    steps:
      # 1. Клонирование репозитория (для доступа к истории gh‑pages)
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Получение предыдущей истории Allure из ветки gh-pages
      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: allure-history   # именно эту папку ожидает генератор отчёта

      # 3. Загрузка артефакта allure-results из предыдущей джобы
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      # 4. Генерация Allure‑отчёта с историей
      - name: Generates Allure Report with history
        uses: simple-elf/allure-report-action@v1.13
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history

      # 5. Публикация отчёта на GitHub Pages
      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history