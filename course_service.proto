syntax = "proto3";

package course;

// Запрос на получение курса
message GetCourseRequest {
  string course_id = 1;
}

// Ответ с данными курса
message GetCourseResponse {
  string course_id = 1;
  string title = 2;
  string description = 3;
}

// Сервис курсов
service CourseService {
  rpc GetCourse(GetCourseRequest) returns (GetCourseResponse);
}